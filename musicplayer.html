<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Music Player</title>
 <style>
    body {
  font-family: Arial, sans-serif;
  background-color: #1e1e1e;
  color: white;
  text-align: center;
  padding: 50px;
}
.player {
  height: 260px;
  width: 25%;
  margin-top: 130px;
  background-color: #333;
  padding: 20px;
  border-radius: 10px;
  display: inline-block;
}
.controls button {
  height: 50px;
  width: 80px;
  background-color: #007acc;
  color: white;
  border: none;
  padding: 10px 20px;
  margin-top: 100px;
  border-radius: 5px;
  cursor: pointer;
  margin-left: 20px;
  position: relative;
  left: -10px;
  top: -60px;
}
h1{
  margin-top: 30px;
  font-size: 35px;
}
p{
  margin-top: -20px;
  font-size: 18px;
}
.controls button:hover {
  background-color: #005f99;
}
 </style>
</head>
<body>
  <div class="player">
    <h1>Music Player</h1>
    <audio id="audio" src="Fear Song  - Telugu (PenduJatt.Com.Se).mp3"></audio>
    <div class="controls">
      <button onclick="playAudio()">Play</button>
      <button onclick="pauseAudio()">Pause</button>
    </div>
    <p >Now Playing: Devara song</p>
  </div>
  <script> 
  const audio = document.getElementById('audio');
    function playAudio() {
        audio.play();
    }
    function pauseAudio() {
        audio.pause();
    }
  </script>
</body>
</html>
